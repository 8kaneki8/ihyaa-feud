name = "ihyaa-feud"
main = "worker.js"
compatibility_date = "2026-11-26"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/room/*"]

[[durable_objects.bindings]]
name = "MATCH_ROOM"
class_name = "MatchRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MatchRoom"]
